[build]
target = "riscv32imac-esp-espidf"

[unstable]
build-std = ["std", "panic_abort"]

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = [
    "-C", "force-frame-pointers",  # recommended for proper stack traces
    "--cfg", "espidf_time64",      # must be set for ESP-IDF 5.0 and above
]

[env]
MCU="esp32c6"

ESP_IDF_VERSION = "6.1.1"
#ESP_IDF_VERSION = "5.5.6"

ESP_IDF_TOOLS_INSTALL_DIR = "global"
    # "out":        '{cargo output}/espressif'
    # "global":     '~/.espressif'; needs 'ldproxy'

# Need to use these if your 'target' has been placed elsewhere.
CARGO_WORKSPACE_DIR = { value = "", relative = true }

# Suppress some 'esp-idf-sys' warnings:
#   <<
#       [esp-idf-sys 0.38.1] clang diag: /home/ubuntu/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/esp-idf-sys-0.37.2/src/include/esp-idf/bindings.h:383:5: warning: macro expansion producing 'defined' has undefined behavior [-Wexpansion-to-defined]
#   <<
BINDGEN_EXTRA_CLANG_ARGS="-Wno-expansion-to-defined"

# ESP-IDF brings in quite a few components, by default. This replaces the defaults with an explicit list, to reduce
# the time 'esp-idf-sys' builds ESP-IDF.
#
# Only "roots" are listed; their dependencies (incl. 'pthread', 'vfs', 'esp_timer', 'esp_driver_gpio|uart|spi',
# 'sdmmc', 'wear_levelling') are pulled in automatically. See 'skinned/Components-6.1.md'.
#
# - separator is ';' (no trimming!): end each line with ';\'
# - 'main':             'esp-idf-sys' CMake project links a test ELF needing its (empty) 'app_main'
# - 'driver', 'esp_adc', 'esp_driver_*':
#                       'esp-idf-hal' 0.47 compiles 'can' (legacy 'driver/twai.h'), 'adc', 'i2c', 'i2s',
#                       'ledc', 'rmt', 'pcnt', 'timer' unconditionally
# - 'fatfs', 'spiffs':  'esp-idf-svc' 0.53 'io::vfs' and 'partition' (wear levelling) are not gated by component
# - 'lwip', 'nvs_flash': not required; kept so that the set matches what Rust 'std' on ESP-IDF implies
#                       ('std::net' sockets, NVS storage)
#
ESP_IDF_COMPONENTS = """\
    main;\
    driver;\
    esp_adc;\
    esp_driver_i2c;\
    esp_driver_i2s;\
    esp_driver_ledc;\
    esp_driver_rmt;\
    esp_driver_twai;\
    esp_driver_gptimer;\
    esp_driver_pcnt;\
    fatfs;\
    spiffs;\
    lwip;\
    nvs_flash\
"""
